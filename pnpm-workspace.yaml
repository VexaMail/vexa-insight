# Packages published by this organisation are exempt from the minimum release
# age. That policy exists to let a compromised third-party release be caught
# and unpublished before it reaches a build; it buys nothing against a registry
# account we control and publish from ourselves, and without this exemption
# every internal release blocks every deploy for a full day. Third-party
# packages stay subject to the policy.
minimumReleaseAgeExclude:
  - '@busirocket/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Installs the git hooks in lefthook.yml on `pnpm install`.
  lefthook: true
  sharp: true
  unrs-resolver: true

# Force patched versions for transitive dependencies flagged by `pnpm audit`.
# Reviewed individually — see SECURITY.md for the rationale per package.
overrides:
  # eslint-config-next pins typescript-eslint 8.59.x, which breaks with
  # TypeScript 7 — force the TS7-compatible line across the tree.
  'typescript-eslint': ^8.65.0
  '@typescript-eslint/eslint-plugin': ^8.65.0
  '@typescript-eslint/parser': ^8.65.0
  dompurify: ^3.4.7
  esbuild: ^0.25.0
  postcss: ^8.5.18
  tmp: ^0.2.6
  # Capped, not open-ended: an unbounded `>=` range resolves to the next major
  # and reintroduces the advisory it was meant to close.
  'brace-expansion@1': ^1.1.18
  'brace-expansion@2': ^2.0.3
  'brace-expansion@5': ^5.0.9
  'ip-address': ^10.3.1
  'js-yaml@3': ^3.15.1
  nanoid: ^3.3.18
  ws: ^8.21.0
  uuid: ^11.1.1
  vite: ^8.0.16
  # extract-zip has no patched release at all: the advisory names >=2.0.2 and
  # 2.0.1 is the latest published version. @puppeteer/browsers 3.x dropped it
  # for modern-tar, so raising the consumer closes the advisory where
  # overriding the vulnerable package itself cannot. Verified with
  # `lhci healthcheck`, which resolves the toolchain and finds Chrome - not by
  # reading the audit.
  '@puppeteer/browsers': ^3.2.1
  'deepmerge-ts': ^8.0.0
  sharp: ^0.35.4
  '@babel/core': ^7.29.1
  'body-parser': ^1.20.6
  undici: ^7.29.0
