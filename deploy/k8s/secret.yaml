# Template: populate values before applying, or generate with
# `kubectl create secret generic vexa-secrets --from-literal=SECRET_KEY=... --dry-run=client -o yaml`.
# Do NOT commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: vexa-secrets
  namespace: vexa
type: Opaque
stringData:
  # Encryption key for IMAP credentials and other sensitive at-rest data.
  # Must be a stable 32-byte (base64) value; rotating it requires re-encrypting
  # existing rows. See SECURITY.md.
  SECRET_KEY: 'REPLACE_ME'
  # SSO/OIDC (optional). Only required when VEXA_AUTH_PROVIDER=oidc.
  # VEXA_AUTH_PROVIDER: "oidc"
  # OIDC_ISSUER_URL: ""
  # OIDC_CLIENT_ID: ""
  # OIDC_CLIENT_SECRET: ""
  # OIDC_REDIRECT_URI: "https://vexa.example.com/api/auth/oidc/callback"
