# Vexa Mail Insight – default compose
#
# Two ways to run:
#   1) Pull the latest published image (recommended for production):
#        docker compose pull && docker compose up -d
#   2) Build from source (for development / forks): swap `image:` for the
#      commented `build: .` line below, then `docker compose up -d --build`.
#
# To enable hands-off auto-updates, layer the Watchtower override:
#   docker compose -f docker-compose.yml -f docker-compose.watchtower.yml up -d
#
# Migrations run automatically on container start. Your data lives in the
# `vexa-data` volume and is preserved across upgrades.

services:
  web:
    image: ${VEXA_IMAGE:-ghcr.io/vexamail/vexa-insight:latest}
    # Uncomment the build block below (and comment out `image:`) to build
    # from the local checkout instead of pulling the published image.
    # build: .
    pull_policy: always
    # Loopback only: put a TLS reverse proxy in front (docs/DEPLOY-BEHIND-PROXY.md)
    # and change this to '3000:3000' only if you really want a bare public port.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/vexa.db
      # SECRET_KEY must be set to a random 32+ char value before going to prod.
      # Leaving CHANGE_ME triggers the first-run installer and refuses admin auth.
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME}
      - IMAP_SERVER=${IMAP_SERVER:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USERNAME=${IMAP_USERNAME:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - INGESTION_INTERVAL_MINUTES=${INGESTION_INTERVAL_MINUTES:-60}
      - INGESTION_DAYS_BACK=${INGESTION_DAYS_BACK:-30}
      - VEXA_IMAP_DEBUG=${VEXA_IMAP_DEBUG:-false}
      - VEXA_UPDATE_CHECK_ENABLED=${VEXA_UPDATE_CHECK_ENABLED:-true}
      - VEXA_UPDATE_REPO=${VEXA_UPDATE_REPO:-}
      # First-run installer is loopback-only unless this is set; behind a proxy
      # you also need the public origin(s) allow-listed for Server Actions.
      - VEXA_ALLOW_REMOTE_INSTALL=${VEXA_ALLOW_REMOTE_INSTALL:-}
      - VEXA_ALLOWED_ORIGINS=${VEXA_ALLOWED_ORIGINS:-}
    volumes:
      - vexa-data:/app/data
    restart: unless-stopped
    labels:
      # Watchtower opt-in label: only updated when the override compose is layered.
      - 'com.centurylinklabs.watchtower.enable=true'

volumes:
  vexa-data:
