# Vexa Mail Insight – run with: docker compose up --build
# Set env in .env (SECRET_KEY, IMAP_* optional). Migrations run on container start.

services:
  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/vexa.db
      - SECRET_KEY=${SECRET_KEY:-change-me-min-32-chars}
      - IMAP_SERVER=${IMAP_SERVER:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USERNAME=${IMAP_USERNAME:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - INGESTION_INTERVAL_MINUTES=${INGESTION_INTERVAL_MINUTES:-60}
      - INGESTION_DAYS_BACK=${INGESTION_DAYS_BACK:-7}
    volumes:
      - vexa-data:/app/data
    restart: unless-stopped

volumes:
  vexa-data:
